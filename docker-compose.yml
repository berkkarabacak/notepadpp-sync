# ---------------------------------------------------------------------------
# Notepad++ Sync — production/self-hosted compose stack
#
#   docker compose up -d
#
# Starts: API server (Go) + PostgreSQL. Blob storage defaults to a local
# volume; set BLOB_BACKEND=s3 plus S3_* env vars to use S3/R2/MinIO instead.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-npsync}
      POSTGRES_USER: ${POSTGRES_USER:-npsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [npsync]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ghcr.io/your-org/notepadpp-sync-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NPSYNC_LISTEN_ADDR: ":8080"
      NPSYNC_DATABASE_URL: postgres://${POSTGRES_USER:-npsync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-npsync}?sslmode=disable
      NPSYNC_BLOB_BACKEND: ${BLOB_BACKEND:-fs}
      NPSYNC_BLOB_FS_DIR: /data/blobs
      NPSYNC_TOKEN_SIGNING_KEY: ${TOKEN_SIGNING_KEY:?Set TOKEN_SIGNING_KEY in .env (64 hex chars)}
      NPSYNC_REQUIRE_HTTPS: "true"
      NPSYNC_BASE_URL: ${BASE_URL:-https://sync.myserver.com}
      NPSYNC_MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
      NPSYNC_MAX_BATCH_BYTES: ${MAX_BATCH_BYTES:-262144000}
      NPSYNC_MAX_DEVICES: ${MAX_DEVICES:-10}
      NPSYNC_VERSION_RETENTION: ${VERSION_RETENTION:-30}
      NPSYNC_REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      # S3-compatible blob storage (only when BLOB_BACKEND=s3):
      NPSYNC_S3_ENDPOINT: ${S3_ENDPOINT:-}
      NPSYNC_S3_BUCKET: ${S3_BUCKET:-}
      NPSYNC_S3_REGION: ${S3_REGION:-auto}
      NPSYNC_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      NPSYNC_S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - blobdata:/data/blobs
    ports:
      - "8080:8080"
    networks: [npsync]

networks:
  npsync:

volumes:
  pgdata:
  blobdata:
