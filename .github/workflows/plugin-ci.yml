name: Plugin CI

# Check-only. Do not commit, rebase, or push from CI: pull_request
# checkouts are detached merge refs, and rewriting them conflicts.
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugin/**'
      - 'installer/**'
      - '.github/workflows/plugin-ci.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'installer/**'
      - '.github/workflows/plugin-ci.yml'
      - '.github/workflows/release.yml'

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64)
        run: cmake -B plugin/build -S plugin -A x64

      - name: Build plugin (Release)
        run: cmake --build plugin/build --config Release

      - name: Run core tests
        run: ctest --test-dir plugin/build -C Release --output-on-failure

      - name: Static analysis (MSVC /analyze)
        run: cmake --build plugin/build --config Release --target NppSync -- /p:RunCodeAnalysis=true /p:CodeAnalysisRuleSet=NativeRecommendedRules.ruleset
        continue-on-error: true  # analysis is advisory until the rule set is tuned

      - name: Check clang-format
        shell: pwsh
        run: |
          $dirty = @()
          Get-ChildItem -Recurse plugin/src,plugin/tests -Include *.cpp,*.h | ForEach-Object {
            & clang-format --dry-run --Werror --style=file $_.FullName
            if ($LASTEXITCODE -ne 0) { $dirty += $_.FullName }
          }
          if ($dirty.Count -gt 0) {
            Write-Host "clang-format would change:"
            $dirty | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { throw "choco install nsis failed with exit code $LASTEXITCODE" }
          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis.exe was not found after installing NSIS." }
          Split-Path -Parent $makensis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Package ZIP and installer
        shell: pwsh
        run: powershell -File installer/package.ps1 -Version 0.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: NppSync-setup
          path: |
            dist/NotepadPlusPlusSync-v0.0.0-win64-setup.exe
            dist/NotepadPlusPlusSync-v0.0.0-win64.zip
