name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  plugin-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64)
        run: cmake -B plugin/build -S plugin -A x64

      - name: Build plugin (Release x64)
        run: cmake --build plugin/build --config Release

      - name: Run all tests
        run: ctest --test-dir plugin/build -C Release --output-on-failure

      - name: Package ZIP + checksums
        shell: pwsh
        run: |
          $v = "${GITHUB_REF_NAME}".TrimStart('v')
          powershell -File installer/package.ps1 -Version $v

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NotepadPlusPlusSync-v*-win64.zip
            dist/NotepadPlusPlusSync-v*-win64.zip.sha256
          generate_release_notes: true

  server-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: npsync_test
          POSTGRES_USER: npsync
          POSTGRES_PASSWORD: npsync_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U npsync -d npsync_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve modules
        working-directory: server
        run: go mod tidy

      - name: Run all server tests
        working-directory: server
        env:
          NPSYNC_TEST_DATABASE_URL: postgres://npsync:npsync_test_password@localhost:5432/npsync_test?sslmode=disable
        run: go test ./... -race -count=1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
